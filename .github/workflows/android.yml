name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Run the integration test on an Android emulator'
        type: boolean
        default: false
      release:
        description: 'Publish the APKs as a GitHub Release (tag v<pubspec version>)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Unit, widget & golden tests with coverage
        run: flutter test --coverage
      - name: Coverage summary
        run: |
          sudo apt-get install -y lcov >/dev/null
          lcov --summary coverage/lcov.info | tee coverage/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/golden/failures/

  build:
    name: Build APKs & AAB
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MISHKAH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mishkah.jks"
            echo "MISHKAH_KEYSTORE_PATH=$RUNNER_TEMP/mishkah.jks" >> "$GITHUB_ENV"
            echo "Release keystore restored"
          else
            echo "No keystore secret: release APK will be signed with the debug key"
          fi
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APKs (universal + per ABI)
        env:
          MISHKAH_KEYSTORE_PASSWORD: ${{ secrets.MISHKAH_KEYSTORE_PASSWORD }}
          MISHKAH_KEY_ALIAS: ${{ secrets.MISHKAH_KEY_ALIAS }}
          MISHKAH_KEY_PASSWORD: ${{ secrets.MISHKAH_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Build App Bundle
        env:
          MISHKAH_KEYSTORE_PASSWORD: ${{ secrets.MISHKAH_KEYSTORE_PASSWORD }}
          MISHKAH_KEY_ALIAS: ${{ secrets.MISHKAH_KEY_ALIAS }}
          MISHKAH_KEY_PASSWORD: ${{ secrets.MISHKAH_KEY_PASSWORD }}
        run: flutter build appbundle --release
      - name: Collect outputs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/mishkah-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/mishkah-release-universal.apk
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do cp "$f" "dist/mishkah-$(basename "$f" | sed 's/^app-//')"; done
          cp build/app/outputs/bundle/release/app-release.aab dist/mishkah-release.aab
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: mishkah-apks
          path: dist/
      - name: Release tag name
        id: version
        run: |
          echo "tag=v$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release (tags or manual)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mishkah ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
          generate_release_notes: true

  integration:
    name: Integration test (emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: flutter test integration_test
